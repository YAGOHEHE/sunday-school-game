<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cuaderno — Modo juego Historias de lado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B59C3}a:hover{color:#1E3F8C}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #FFFFFF; color: #16181D; font-family: 'Fredoka', 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 20px; padding: 18px 40px; border-bottom: 1px solid #E3E6EB">
<button style="border: 1px solid #E3E6EB; background: #FFFFFF; color: #16181D; border-radius: 10px; padding: 0 16px; min-height: 44px; font: inherit; font-size: 14px">Salir</button>
<span style="width: 6px; height: 36px; border-radius: 3px; background: #6D3FD0"></span>
<div style="display: flex; flex-direction: column; line-height: 1.2">
<span style="font-size: 22px; font-weight: 800">Historias de lado</span>
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 15px; color: #5B6270">情境推理型（海龟汤）</span>
</div>
<span style="margin-left: auto; font-size: 15px; color: #5B6270">10:13 – 10:23</span>
<span style="font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums">07:51</span>
</header>

<div style="flex: 1; display: flex; flex-direction: column; padding: 40px 72px 28px; gap: 28px; min-height: 0">
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: #6D3FD0">HISTORIA 1 DE 5</span>
<div style="display: flex; gap: 4px"><span style="width: 24px; height: 4px; border-radius: 2px; background: #6D3FD0"></span><span style="width: 24px; height: 4px; border-radius: 2px; background: #E3E6EB"></span><span style="width: 24px; height: 4px; border-radius: 2px; background: #E3E6EB"></span><span style="width: 24px; height: 4px; border-radius: 2px; background: #E3E6EB"></span><span style="width: 24px; height: 4px; border-radius: 2px; background: #E3E6EB"></span></div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px">
<p style="margin: 0; font-size: 38px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em">Un hombre entra en un bar y pide un vaso de agua. El camarero saca una pistola y le apunta. El hombre dice «¡gracias!» y se va. ¿Por qué?</p>
<p style="margin: 0; font-family: 'Noto Sans SC', sans-serif; font-size: 36px; font-weight: 500; line-height: 1.5; color: #3A3F4A; border-left: 1px solid #E3E6EB; padding-left: 56px">一个男人走进酒吧，要了一杯水。酒保拿出一把枪指着他。男人说了声“谢谢”就走了。为什么？</p>
</div>

<div style="margin-top: auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
<span style="font-size: 15px; color: #5B6270; margin-right: 4px">Respuesta del profe:</span>
<button style="border: 0; background: #2B8A3E; color: #FFFFFF; border-radius: 14px; padding: 0 28px; min-height: 64px; font: inherit; font-size: 24px; font-weight: 800">Sí · 是</button>
<button style="border: 0; background: #C92A2A; color: #FFFFFF; border-radius: 14px; padding: 0 28px; min-height: 64px; font: inherit; font-size: 24px; font-weight: 800">No · 否</button>
<button style="border: 0; background: #495057; color: #FFFFFF; border-radius: 14px; padding: 0 28px; min-height: 64px; font: inherit; font-size: 24px; font-weight: 800">No tiene relación · 无关</button>
<span style="flex: 1"></span>
<button style="border: 2px solid #6D3FD0; background: #FFFFFF; color: #5B2DBF; border-radius: 14px; padding: 0 24px; min-height: 64px; font: inherit; font-size: 18px; font-weight: 700">Revelar la verdad · 揭晓</button>
</div>
</div>

<footer style="display: flex; align-items: center; gap: 12px; padding: 16px 40px; border-top: 1px solid #E3E6EB; background: #F7F8FA">
<button style="border: 1px solid #E3E6EB; background: #FFFFFF; color: #16181D; border-radius: 10px; padding: 0 16px; min-height: 44px; font: inherit; font-size: 14px">← Historia anterior</button>
<button style="border: 1px solid #E3E6EB; background: #FFFFFF; color: #16181D; border-radius: 10px; padding: 0 16px; min-height: 44px; font: inherit; font-size: 14px">Historia siguiente →</button>
<span style="flex: 1"></span>
<button style="border: 1px solid #E3E6EB; background: #FFFFFF; color: #16181D; border-radius: 10px; padding: 0 16px; min-height: 44px; font: inherit; font-size: 14px">Reto</button>
<button style="border: 1px solid #E3E6EB; background: #FFFFFF; color: #16181D; border-radius: 10px; padding: 0 16px; min-height: 44px; font: inherit; font-size: 14px">Sorteo</button>
<button style="border: 0; background: {{accent}}; color: #FFFFFF; border-radius: 10px; padding: 0 18px; min-height: 44px; font: inherit; font-size: 14px; font-weight: 700">10:23 Batalla de mímica →</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#2B8A3E","#16181D"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2B59C3' };
}
}
</script>
</body>
</html>
