<!doctype html>

<head>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>

</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; background: {{stage}}; color: #FFFFFF; font-family: 'Fredoka', 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 24px; gap: 16px">

<header style="display: flex; align-items: center; gap: 14px">

<span style="font-size: 36px">🙊</span>

<div style="display: flex; gap: 6px; margin-left: 18px; align-items: center" aria-label="Juego 4 de 5">
<span style="width: 26px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.9)"></span><span style="width: 26px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.9)"></span><span style="width: 26px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.9)"></span><span style="width: 42px; height: 8px; border-radius: 999px; background: #FFFFFF"></span><span style="width: 26px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.35)"></span>
<span style="font-size: 15px; margin-left: 6px">4 / 5</span>
</div>
<div style="margin-left: auto; display: flex; align-items: center; gap: 10px">
<button aria-label="Enviar a la tele con AirPlay" style="width: 52px; height: 52px; border-radius: 16px; border: 0; background: rgba(0,0,0,0.22); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 17h14a1 1 0 00.8-1.6l-7-9.3a1 1 0 00-1.6 0l-7 9.3A1 1 0 005 17z"></path><path d="M8.5 20.5h7L12 16z" fill="currentColor" stroke="none"></path></svg></button>
<div style="display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.22); border-radius: 999px; padding: 6px 8px 6px 18px">
<span style="font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums">00:18</span>
<button aria-label="Pausar" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; color: #9D174D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg></button>
</div>
</div>
</header>

<nav style="display: flex; gap: 8px">
<button style="border: 0; background: #FFFFFF; color: #9D174D; border-radius: 999px; padding: 0 20px; min-height: 48px; font: inherit; font-size: 16px; font-weight: 600">Palabras · 随机</button>
<button style="border: 0; background: rgba(255,255,255,0.16); color: #FFFFFF; border-radius: 999px; padding: 0 20px; min-height: 48px; font: inherit; font-size: 16px">Temporizador · 计时器</button>
<button style="border: 0; background: rgba(255,255,255,0.16); color: #FFFFFF; border-radius: 999px; padding: 0 20px; min-height: 48px; font: inherit; font-size: 16px">Ficha · 说明</button>
</nav>

<div style="flex: 1; display: flex; gap: 20px; min-height: 0">
<div style="flex: 1; background: #FFFFFF; color: #1F1D2B; border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative">
<div style="position: absolute; top: 22px; left: 24px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 70%">
<span style="font-size: 14px; background: #BE185D; color: #FFFFFF; border-radius: 999px; padding: 6px 12px; font-weight: 600">Profesiones · 职业</span>
<span style="font-size: 14px; background: #F0EDE5; color: #3F3C4C; border-radius: 999px; padding: 6px 12px">Deportes</span>
<span style="font-size: 14px; background: #F0EDE5; color: #3F3C4C; border-radius: 999px; padding: 6px 12px">Animales</span>
<span style="font-size: 14px; background: #F0EDE5; color: #3F3C4C; border-radius: 999px; padding: 6px 12px">Películas</span>
</div>
<span style="position: absolute; top: 26px; right: 28px; font-size: 14px; color: #5E5B6B">quedan 9 de 12</span>
<span style="font-size: 128px; font-weight: 700; line-height: 1">bombero</span>
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 84px; font-weight: 900; color: #BE185D; line-height: 1.1">消防员</span>
<div style="position: absolute; bottom: 24px; display: flex; align-items: center; gap: 12px">
<button style="border: 0; background: #1F1D2B; color: #FFFFFF; border-radius: 999px; padding: 0 32px; min-height: 60px; font: inherit; font-size: 20px; font-weight: 600">Otra palabra · 换一个</button>
</div>
<span style="position: absolute; bottom: -2px; left: 0; right: 0; text-align: center; font-size: 13px; color: #B8B3A6; transform: translateY(-120px); pointer-events: none">o desliza ← → para cambiar</span>
</div>

<aside style="width: 300px; display: flex; flex-direction: column; gap: 14px">
<div style="background: rgba(0,0,0,0.22); border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: center; flex: 1; justify-content: center"><span style="font-size: 16px; font-weight: 600">Equipo 1</span><span style="font-size: 80px; font-weight: 700; line-height: 1">5</span><div style="display: flex; gap: 12px"><button aria-label="Restar punto al equipo 1" style="width: 60px; height: 60px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.55); background: transparent; color: #FFFFFF; font-size: 28px">−</button><button aria-label="Sumar punto al equipo 1" style="width: 60px; height: 60px; border-radius: 999px; border: 0; background: #FFFFFF; color: #9D174D; font-size: 28px; font-weight: 700">+</button></div></div>
<div style="background: rgba(0,0,0,0.22); border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: center; flex: 1; justify-content: center"><span style="font-size: 16px; font-weight: 600">Equipo 2</span><span style="font-size: 80px; font-weight: 700; line-height: 1">3</span><div style="display: flex; gap: 12px"><button aria-label="Restar punto al equipo 2" style="width: 60px; height: 60px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.55); background: transparent; color: #FFFFFF; font-size: 28px">−</button><button aria-label="Sumar punto al equipo 2" style="width: 60px; height: 60px; border-radius: 999px; border: 0; background: #FFFFFF; color: #9D174D; font-size: 28px; font-weight: 700">+</button></div></div>
</aside>
</div>

<footer style="display: flex; align-items: center; gap: 12px">
<button aria-label="Juego anterior" style="width: 56px; height: 56px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.55); background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="flex: 1; display: flex; justify-content: center; gap: 12px">
<button style="border: 0; background: #FFFFFF; color: #1F1D2B; border-radius: 16px; padding: 0 26px; min-height: 56px; font: inherit; font-size: 17px; font-weight: 600">🎲 Reto · 挑战</button>
<button style="border: 0; background: #FFFFFF; color: #1F1D2B; border-radius: 16px; padding: 0 26px; min-height: 56px; font: inherit; font-size: 17px; font-weight: 600">🎯 Sorteo · 抽签</button>
</div>
<button style="border: 0; background: #1F1D2B; color: #FFFFFF; border-radius: 16px; padding: 0 24px; min-height: 56px; font: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px">Siguiente: Bolsa de identidad<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"color","default":"#BE185D","options":["#BE185D","#6D3FD0","#15803D","#C2410C"]},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
renderVals() {
return { stage: this.props.stage ?? '#BE185D' };
}
}
</script>
</body>
</html>
