<label style="display: flex; align-items: center; gap: 14px; border: 1px solid #ECE8DF; border-radius: 16px; padding: 12px 14px; min-height: 56px">

<span style="width: 56px; height: 36px; border-radius: 8px; background: #0B0B0F"></span>
<span style="flex: 1; font-size: 16px; font-weight: 600">Reloj</span>

<span style="width: 56px; height: 36px; border-radius: 8px; background: #1C1C24; display: flex; align-items: center; justify-content: flex-end; padding-right: 5px; box-sizing: border-box; gap: 2px"><span style="width: 10px; height: 26px; border-radius: 3px; background: #2A2A35"></span></span>

<span style="font-size: 12px; background: #EEE6FD; color: #5B2DBF; border-radius: 999px; padding: 4px 10px; font-weight: 600">MÍA</span>

<div style="display: flex; gap: 16px; align-items: center; margin-top: 6px">
