<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Recreo — Modo juego Mímica</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FDE2EC}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: {{stage}}; color: #FFFFFF; font-family: 'Fredoka', 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 32px; gap: 20px">

<header style="display: flex; align-items: center; gap: 16px">
<button style="border: 2px solid rgba(255,255,255,0.6); background: transparent; color: #FFFFFF; border-radius: 999px; padding: 0 18px; min-height: 44px; font: inherit; font-size: 15px">Salir · 退出</button>
<span style="font-size: 40px">🙊</span>
<div style="display: flex; flex-direction: column; line-height: 1.1">
<span style="font-size: 28px; font-weight: 700">Batalla de mímica</span>
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 17px; opacity: 0.85">团队哑剧大战</span>
</div>
<div style="display: flex; gap: 6px; margin-left: 20px; align-items: center" aria-label="Juego 4 de 5">
<span style="width: 28px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.9)"></span>
<span style="width: 28px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.9)"></span>
<span style="width: 28px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.9)"></span>
<span style="width: 44px; height: 8px; border-radius: 999px; background: #FFFFFF"></span>
<span style="width: 28px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.35)"></span>
<span style="font-size: 15px; margin-left: 6px">4 / 5</span>
</div>
<div style="margin-left: auto; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.22); border-radius: 999px; padding: 6px 8px 6px 18px">
<span style="font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums">00:18</span>
<button aria-label="Pausar" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #FFFFFF; color: #9D174D; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg></button>
</div>
</header>

<nav style="display: flex; gap: 8px">
<button style="border: 0; background: #FFFFFF; color: #9D174D; border-radius: 999px; padding: 0 18px; min-height: 44px; font: inherit; font-size: 15px; font-weight: 600">Palabras · 随机</button>
<button style="border: 0; background: rgba(255,255,255,0.16); color: #FFFFFF; border-radius: 999px; padding: 0 18px; min-height: 44px; font: inherit; font-size: 15px">Temporizador · 计时器</button>
<button style="border: 0; background: rgba(255,255,255,0.16); color: #FFFFFF; border-radius: 999px; padding: 0 18px; min-height: 44px; font: inherit; font-size: 15px">Ficha · 说明</button>
</nav>

<div style="flex: 1; display: flex; gap: 24px; min-height: 0">
<div style="flex: 1; background: #FFFFFF; color: #1F1D2B; border-radius: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative">
<div style="position: absolute; top: 24px; left: 28px; display: flex; gap: 6px">
<span style="font-size: 14px; background: #BE185D; color: #FFFFFF; border-radius: 999px; padding: 6px 12px; font-weight: 600">Profesiones · 职业</span>
<span style="font-size: 14px; background: #F0EDE5; color: #3F3C4C; border-radius: 999px; padding: 6px 12px">Deportes</span>
<span style="font-size: 14px; background: #F0EDE5; color: #3F3C4C; border-radius: 999px; padding: 6px 12px">Animales</span>
<span style="font-size: 14px; background: #F0EDE5; color: #3F3C4C; border-radius: 999px; padding: 6px 12px">Películas</span>
<span style="font-size: 14px; background: #F0EDE5; color: #3F3C4C; border-radius: 999px; padding: 6px 12px">Biblia</span>
</div>
<span style="position: absolute; top: 28px; right: 32px; font-size: 14px; color: #5E5B6B">quedan 9 de 12</span>
<span style="font-size: 150px; font-weight: 700; line-height: 1">bombero</span>
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 96px; font-weight: 900; color: #BE185D; line-height: 1.1">消防员</span>
<button style="position: absolute; bottom: 28px; border: 0; background: #1F1D2B; color: #FFFFFF; border-radius: 999px; padding: 0 28px; min-height: 56px; font: inherit; font-size: 20px; font-weight: 600">Otra palabra · 换一个 <span style="opacity: 0.6; font-size: 15px">(espacio)</span></button>
</div>

<aside style="width: 300px; display: flex; flex-direction: column; gap: 14px">
<div style="background: rgba(0,0,0,0.22); border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 8px; align-items: center">
<span style="font-size: 16px; font-weight: 600">Equipo 1</span>
<span style="font-size: 88px; font-weight: 700; line-height: 1">5</span>
<div style="display: flex; gap: 10px"><button aria-label="Restar punto al equipo 1" style="width: 52px; height: 52px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.6); background: transparent; color: #FFFFFF; font-size: 24px">−</button><button aria-label="Sumar punto al equipo 1" style="width: 52px; height: 52px; border-radius: 999px; border: 0; background: #FFFFFF; color: #9D174D; font-size: 24px; font-weight: 700">+</button></div>
</div>
<div style="background: rgba(0,0,0,0.22); border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 8px; align-items: center">
<span style="font-size: 16px; font-weight: 600">Equipo 2</span>
<span style="font-size: 88px; font-weight: 700; line-height: 1">3</span>
<div style="display: flex; gap: 10px"><button aria-label="Restar punto al equipo 2" style="width: 52px; height: 52px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.6); background: transparent; color: #FFFFFF; font-size: 24px">−</button><button aria-label="Sumar punto al equipo 2" style="width: 52px; height: 52px; border-radius: 999px; border: 0; background: #FFFFFF; color: #9D174D; font-size: 24px; font-weight: 700">+</button></div>
</div>
</aside>
</div>

<footer style="display: flex; align-items: center; gap: 12px">
<button style="border: 2px solid rgba(255,255,255,0.6); background: transparent; color: #FFFFFF; border-radius: 999px; padding: 0 18px; min-height: 48px; font: inherit; font-size: 15px">← Anterior</button>
<div style="flex: 1; display: flex; justify-content: center; gap: 12px">
<button style="border: 0; background: #FFFFFF; color: #1F1D2B; border-radius: 999px; padding: 0 22px; min-height: 48px; font: inherit; font-size: 16px; font-weight: 600">Reto · 挑战</button>
<button style="border: 0; background: #FFFFFF; color: #1F1D2B; border-radius: 999px; padding: 0 22px; min-height: 48px; font: inherit; font-size: 16px; font-weight: 600">Sorteo · 抽签</button>
</div>
<button style="border: 0; background: #1F1D2B; color: #FFFFFF; border-radius: 999px; padding: 0 22px; min-height: 48px; font: inherit; font-size: 16px; font-weight: 600">Siguiente: Bolsa de identidad →</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"color","default":"#BE185D","options":["#BE185D","#6D3FD0","#15803D","#C2410C"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { stage: this.props.stage ?? '#BE185D' };
}
}
</script>
</body>
</html>
